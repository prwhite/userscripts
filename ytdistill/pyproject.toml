[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdistill"
description = "Distill a YouTube video into the paragraph it should have been."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "yt-dlp>=2024.1.0",
  "requests>=2.28",
  "pydantic>=2.0",
  "openai>=1.40",
  "anthropic>=0.69.0",
]

[project.scripts]
ytdistill = "ytdistill.__main__:main"

[tool.setuptools]
packages = ["ytdistill"]

# Single source of truth for the version lives in ytdistill/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "ytdistill.__version__" }

[tool.setuptools.package-data]
ytdistill = ["prompts/*.md"]
